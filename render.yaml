services:
  - type: web
    name: smartsense-demo
    env: python
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn App.web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: SMARTSENSE_DATA_ROOT
        value: data_demo
